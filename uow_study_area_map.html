<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline schematic — UOW Dubai study area</title>
  <style>
    :root { color-scheme: light; font-family: Arial, sans-serif; color: #17354a; }
    body { margin: 0; background: #f4f7f8; }
    main { max-width: 980px; margin: 24px auto; padding: 0 18px; }
    h1 { margin: 0 0 8px; font-size: 25px; }
    p { line-height: 1.5; }
    .note { padding: 12px 15px; border-left: 5px solid #d68a28; background: #fff6e8; }
    svg { display: block; width: 100%; height: auto; background: white; border: 1px solid #ccd8dd; border-radius: 12px; }
    .label { font-size: 17px; fill: #17354a; }
    .small { font-size: 13px; fill: #506775; }
  </style>
</head>
<body>
<main>
  <h1>UOW Dubai study area — offline schematic</h1>
  <p class="note"><strong>Illustrative only:</strong> this is not a street map. The circle represents a 3 km study radius around UOW Dubai for context. All source, zone, and pipe positions are hypothetical and do not represent real campus or city irrigation infrastructure.</p>
  <svg viewBox="0 0 800 650" role="img" aria-label="Schematic 3 kilometre study radius with UOW Dubai reference point and hypothetical irrigation zones">
    <rect x="0" y="0" width="800" height="650" fill="#fbfdfe"/>
    <circle cx="400" cy="310" r="245" fill="#eaf5f8" stroke="#28759c" stroke-width="3"/>
    <text x="400" y="82" text-anchor="middle" class="label">3 km study radius (schematic, not to scale)</text>
    <line x1="155" y1="310" x2="645" y2="310" stroke="#c6d5db" stroke-dasharray="5 7"/>
    <line x1="400" y1="65" x2="400" y2="555" stroke="#c6d5db" stroke-dasharray="5 7"/>
    <text x="400" y="48" text-anchor="middle" class="small">North (diagram orientation only)</text>
    <g stroke="#597f97" stroke-width="4" stroke-dasharray="8 7" fill="none">
      <path d="M330 310 L400 310"/><path d="M400 310 L400 240"/><path d="M400 310 L470 310"/><path d="M400 310 L400 380"/>
    </g>
    <circle cx="330" cy="310" r="10" fill="#e2a13a" stroke="#985b10" stroke-width="2"/>
    <text x="315" y="290" text-anchor="end" class="label">Hypothetical source</text>
    <rect x="390" y="300" width="20" height="20" rx="4" fill="#153e58"/>
    <text x="420" y="315" class="label">UOW Dubai reference point</text>
    <circle cx="400" cy="240" r="11" fill="#24a47f" stroke="#116b55" stroke-width="2"/>
    <text x="400" y="215" text-anchor="middle" class="label">Zone A</text>
    <circle cx="470" cy="310" r="11" fill="#24a47f" stroke="#116b55" stroke-width="2"/>
    <text x="495" y="316" class="label">Zone B</text>
    <circle cx="400" cy="380" r="11" fill="#24a47f" stroke="#116b55" stroke-width="2"/>
    <text x="400" y="414" text-anchor="middle" class="label">Zone C</text>
    <text x="400" y="580" text-anchor="middle" class="small">Zones and pipes are illustrative; positions and spacing are not to scale.</text>
    <text x="400" y="602" text-anchor="middle" class="small">Dashed lines show the simplified simulation network only.</text>
  </svg>
</main>
</body>
</html>
